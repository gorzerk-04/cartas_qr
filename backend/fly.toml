app = "menuqr-backend"       # ajustar a un nombre único disponible en Fly.io
primary_region = "gru"       # ajustar a la región más cercana a los usuarios / a la región del proyecto de Neon

[build]

[env]
  ENVIRONMENT = "production"
  ACCESS_TOKEN_EXPIRE_MINUTES = "15"
  REFRESH_TOKEN_EXPIRE_DAYS = "7"
  # ALLOWED_ORIGINS y FRONTEND_BASE_URL se completan después de desplegar el frontend
  # en Vercel (ver README, sección "Despliegue en Vercel + Fly.io + Neon") vía
  # `fly secrets set` o editando este bloque.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
